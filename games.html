        /* ============================================================
           24. 2048 MINI
        ============================================================ */

        function game2048() {

            const N = 4;

            let board =
                Array.from(
                    { length: N },
                    () => Array(N).fill(0)
                );

            let score = 0;
            let active = true;

            $("gameArea").innerHTML = `
    <div
      id="board2048"
      style="
        width:min(92vw,460px);
        aspect-ratio:1;
        margin:auto;
        padding:8px;
        display:grid;
        grid-template-columns:repeat(4,1fr);
        gap:8px;
        background:#202938;
        border-radius:18px;
        touch-action:none;
      ">
    </div>
  `;

            const boardEl = $("board2048");

            function addTile() {

                const empty = [];

                for (let y = 0; y < N; y++) {
                    for (let x = 0; x < N; x++) {

                        if (!board[y][x]) {
                            empty.push({ x, y });
                        }
                    }
                }

                if (!empty.length) return;

                const spot =
                    empty[Math.floor(Math.random() * empty.length)];

                board[spot.y][spot.x] =
                    Math.random() < .9 ? 2 : 4;
            }

            function slide(line) {

                const values =
                    line.filter(Boolean);

                const result = [];

                for (let i = 0; i < values.length; i++) {

                    if (
                        i < values.length - 1 &&
                        values[i] === values[i + 1]
                    ) {

                        result.push(values[i] * 2);
                        score += values[i] * 2;
                        i++;

                    } else {

                        result.push(values[i]);

                    }
                }

                while (result.length < N) {
                    result.push(0);
                }

                return result;
            }

            function move(direction) {

                if (!active) return;

                const old =
                    JSON.stringify(board);

                if (direction === "left") {

                    for (let y = 0; y < N; y++) {
                        board[y] = slide(board[y]);
                    }

                } else if (direction === "right") {

                    for (let y = 0; y < N; y++) {
                        board[y] =
                            slide(board[y].slice().reverse())
                                .reverse();
                    }

                } else if (direction === "up") {

                    for (let x = 0; x < N; x++) {

                        const col = [];

                        for (let y = 0; y < N; y++) {
                            col.push(board[y][x]);
                        }

                        const result = slide(col);

                        for (let y = 0; y < N; y++) {
                            board[y][x] = result[y];
                        }
                    }

                } else {

                    for (let x = 0; x < N; x++) {

                        const col = [];

                        for (let y = N - 1; y >= 0; y--) {
                            col.push(board[y][x]);
                        }

                        const result =
                            slide(col).reverse();

                        for (let y = 0; y < N; y++) {
                            board[y][x] = result[y];
                        }
                    }
                }

                if (JSON.stringify(board) !== old) {

                    addTile();
                    draw();

                    if (!canMove()) end();
                }
            }

            function canMove() {

                for (let y = 0; y < N; y++) {
                    for (let x = 0; x < N; x++) {

                        if (!board[y][x]) return true;

                        if (
                            x < N - 1 &&
                            board[y][x] === board[y][x + 1]
                        ) return true;

                        if (
                            y < N - 1 &&
                            board[y][x] === board[y + 1][x]
                        ) return true;
                    }
                }

                return false;
            }

            function draw() {

                boardEl.innerHTML = "";

                board.forEach(row => {
                    row.forEach(value => {

                        const tile = document.createElement("div");

                        tile.style.cssText = `
          display:grid;
          place-items:center;
          border-radius:12px;
          background:${value ? "#172033" : "#111827"};
          color:white;
          font-size:clamp(20px,6vw,34px);
          font-weight:900;
        `;

                        tile.textContent = value || "";

                        boardEl.appendChild(tile);
                    });
                });

                setStats(`
      <span>Score <strong>${score}</strong></span>
      <span>Best <strong>${getBest("2048")}</strong></span>
    `);
            }

            function end() {

                active = false;

                const best = setBest("2048", score);

                msg(
                    best
                        ? "🏆 New 2048 record!"
                        : "No more moves — " + score
                );
            }

            function key(e) {

                const map = {
                    ArrowLeft: "left",
                    ArrowRight: "right",
                    ArrowUp: "up",
                    ArrowDown: "down"
                };

                if (map[e.key]) {

                    e.preventDefault();
                    move(map[e.key]);
                }
            }

            let startTouch = null;

            boardEl.addEventListener("touchstart", e => {

                const t = e.touches[0];

                startTouch = {
                    x: t.clientX,
                    y: t.clientY
                };

            }, { passive: true });

            boardEl.addEventListener("touchend", e => {

                if (!startTouch) return;

                const t = e.changedTouches[0];

                const dx = t.clientX - startTouch.x;
                const dy = t.clientY - startTouch.y;

                if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) {
                    startTouch = null;
                    return;
                }

                if (Math.abs(dx) > Math.abs(dy)) {
                    move(dx > 0 ? "right" : "left");
                } else {
                    move(dy > 0 ? "down" : "up");
                }

                startTouch = null;

            }, { passive: true });

            window.addEventListener("keydown", key);

            addTile();
            addTile();
            draw();

            return () => {
                active = false;
                window.removeEventListener("keydown", key);
            };
        }


        /* ============================================================
           25. MINE FINDER
        ============================================================ */

        function gameMines() {

            const SIZE = 8;
            const MINES = 10;

            let cells = [];
            let revealed = 0;
            let active = true;

            $("gameArea").innerHTML = `
    <div
      id="mineBoard"
      style="
        width:min(94vw,500px);
        margin:auto;
        display:grid;
        grid-template-columns:repeat(8,1fr);
        gap:4px;
      ">
    </div>
  `;

            const board = $("mineBoard");

            function build() {

                cells = Array.from(
                    { length: SIZE * SIZE },
                    () => ({
                        mine: false,
                        revealed: false,
                        number: 0
                    })
                );

                let count = 0;

                while (count < MINES) {

                    const i =
                        Math.floor(Math.random() * cells.length);

                    if (!cells[i].mine) {

                        cells[i].mine = true;
                        count++;
                    }
                }

                cells.forEach((cell, i) => {

                    if (cell.mine) return;

                    const x = i % SIZE;
                    const y = Math.floor(i / SIZE);

                    let n = 0;

                    for (let dy = -1; dy <= 1; dy++) {
                        for (let dx = -1; dx <= 1; dx++) {

                            if (!dx && !dy) continue;

                            const nx = x + dx;
                            const ny = y + dy;

                            if (
                                nx >= 0 && nx < SIZE &&
                                ny >= 0 && ny < SIZE
                            ) {

                                const ni = ny * SIZE + nx;

                                if (cells[ni].mine) n++;
                            }
                        }
                    }

                    cell.number = n;
                });
            }

            function render() {

                board.innerHTML = "";

                cells.forEach((cell, i) => {

                    const button = document.createElement("button");

                    button.style.cssText = `
        aspect-ratio:1;
        border:0;
        border-radius:6px;
        background:${cell.revealed ? "#202a3d" : "#111827"};
        color:white;
        font-weight:900;
        cursor:pointer;
      `;

                    if (cell.revealed) {

                        button.textContent =
                            cell.mine
                                ? "💣"
                                : (cell.number || "");

                    }

                    button.onclick = () => reveal(i);

                    board.appendChild(button);
                });

                setStats(`
      <span>Safe <strong>${revealed}/${cells.length - MINES}</strong></span>
      <span>Mines <strong>${MINES}</strong></span>
    `);
            }

            function reveal(i) {

                if (!active) return;

                const cell = cells[i];

                if (cell.revealed) return;

                cell.revealed = true;

                if (cell.mine) {

                    active = false;

                    cells.forEach(c => {
                        if (c.mine) c.revealed = true;
                    });

                    render();

                    msg("💣 Boom! Try again.");

                    return;
                }

                revealed++;

                if (cell.number === 0) {

                    const x = i % SIZE;
                    const y = Math.floor(i / SIZE);

                    for (let dy = -1; dy <= 1; dy++) {
                        for (let dx = -1; dx <= 1; dx++) {

                            const nx = x + dx;
                            const ny = y + dy;

                            if (
                                nx >= 0 && nx < SIZE &&
                                ny >= 0 && ny < SIZE
                            ) {

                                reveal(ny * SIZE + nx);
                            }
                        }
                    }
                }

                render();

                if (revealed === cells.length - MINES) {

                    active = false;

                    const score = revealed * 10;
                    const best = setBest("mines", score);

                    msg(
                        best
                            ? "🏆 Mine field cleared!"
                            : "🎉 You found every safe square!"
                    );
                }
            }

            build();
            render();

            return () => {
                active = false;
            };
        }

        function gameLights() {

        New Puzzle
      </button>
    </div>
  `;

            const boardEl = $("lightsBoard");

            function toggle(x, y) {

                if (
                    x < 0 || x >= SIZE ||
                    y < 0 || y >= SIZE
                ) return;

                board[y][x] = !board[y][x];
            }

            function press(x, y) {

                if (!active) return;

                toggle(x, y);
                toggle(x - 1, y);
                toggle(x + 1, y);
                toggle(x, y - 1);
                toggle(x, y + 1);

                moves++;

                render();

                if (board.every(row => row.every(v => !v))) {

                    active = false;

                    const score =
                        Math.max(10, 1000 - moves * 20);

                    const best = setBest("lights", score);

                    msg(
                        best
                            ? "🏆 Lights Out record!"
                            : "Puzzle solved in " + moves + " moves!"
                    );
                }
            }

            function randomize() {

                board =
                    Array.from(
                        { length: SIZE },
                        () => Array(SIZE).fill(false)
                    );

                for (let i = 0; i < 12; i++) {

                    const x =
                        Math.floor(Math.random() * SIZE);

                    const y =
                        Math.floor(Math.random() * SIZE);

                    toggle(x, y);
                    toggle(x - 1, y);
                    toggle(x + 1, y);
                    toggle(x, y - 1);
                    toggle(x, y + 1);
                }

                moves = 0;
                active = true;

                render();
            }

            function render() {

                boardEl.innerHTML = "";

                board.forEach((row, y) => {

        `;

                            press(x, y);
                        };

                        boardEl.appendChild(button);
                    });
                });

                setStats(`
      <span>Moves <strong>${moves}</strong></span>
    `);
            }

            $("lightsReset").onclick = randomize;

            randomize();

            return () => {
                active = false;
            };
        }

        /* ============================================================
           30. COIN CATCHER
        ============================================================ */

        function gameCoinCatcher() {

            const canvas = document.createElement("canvas");

            canvas.width = 600;
            canvas.height = 450;

            canvas.style.cssText = `
    display:block;
    width:100%;
    max-width:600px;
    margin:auto;
    border-radius:18px;
    background:#080b12;
    border:1px solid var(--border);
    touch-action:none;
  `;

            $("gameArea").appendChild(canvas);

            const ctx = canvas.getContext("2d");

            let player = {
                x: 270,
                y: 400,
                w: 60,
                h: 18,
                speed: 8
            };

            let objects = [];
            let score = 0;
            let lives = 3;
            let running = true;
            let animation = 0;
            let spawnTimer = 0;

            const keys = {};

            function spawn() {

                const coin = Math.random() < .8;

                objects.push({
                    x: Math.random() * 570,
                    y: -25,
                    size: coin ? 18 : 24,
                    speed: 2 + Math.random() * 3,
                    type: coin ? "coin" : "bomb"
                });
            }

            function update() {

                if (!running) return;

                if (keys.ArrowLeft || keys.a) {
                    player.x -= player.speed;
                }

                if (keys.ArrowRight || keys.d) {
                    player.x += player.speed;
                }

                player.x =
                    Math.max(
                        0,
                        Math.min(600 - player.w, player.x)
                    );

                spawnTimer--;

                if (spawnTimer <= 0) {

                    spawn();

                    spawnTimer = 25 + Math.random() * 25;
                }

                objects.forEach(o => {
                    o.y += o.speed;
                });

                objects = objects.filter(o => o.y < 470);

                objects.forEach(o => {

                    const hit =
                        o.x < player.x + player.w &&
                        o.x + o.size > player.x &&
                        o.y < player.y + player.h &&
                        o.y + o.size > player.y;

                    if (hit) {

                        o.y = 999;

                        if (o.type === "coin") {

                            score++;

                        } else {

                            lives--;

                            msg("💥 Watch out!");

                            if (lives <= 0) {
                                end();
                            }
                        }
                    }
                });

                draw();

                animation = requestAnimationFrame(update);
            }

            function draw() {

                ctx.fillStyle = "#080b12";
                ctx.fillRect(0, 0, 600, 450);

                ctx.fillStyle = "#8b5cf6";

                ctx.fillRect(
                    player.x,
                    player.y,
                    player.w,
                    player.h
                );

                objects.forEach(o => {

                    ctx.beginPath();

                    ctx.fillStyle =
                        o.type === "coin"
                            ? "#facc15"
                            : "#ef4444";

                    ctx.arc(
                        o.x + o.size / 2,
                        o.y + o.size / 2,
                        o.size / 2,
                        0,
                        Math.PI * 2
                    );

                    ctx.fill();
                });

                setStats(`
      <span>Coins <strong>${score}</strong></span>
      <span>Lives <strong>${"❤️".repeat(lives)}</strong></span>
    `);
            }

            function end() {

                if (!running) return;

                running = false;

                cancelAnimationFrame(animation);

                const best = setBest("coin", score);

                msg(
                    best
                        ? "🏆 New Coin Catcher record!"
                        : "Game over — " + score
                );
            }

            function keydown(e) {

                keys[e.key] = true;

                if ([
                    "ArrowLeft",
                    "ArrowRight"
                ].includes(e.key)) {
                    e.preventDefault();
                }
            }

            function keyup(e) {
                keys[e.key] = false;
            }

            window.addEventListener("keydown", keydown);
            window.addEventListener("keyup", keyup);

            canvas.addEventListener("pointermove", e => {

                const rect = canvas.getBoundingClientRect();

                const x =
                    (e.clientX - rect.left) /
                    rect.width * 600;

                player.x = x - player.w / 2;

            });

            canvas.addEventListener("touchmove", e => {

                const rect = canvas.getBoundingClientRect();

                const x =
                    (e.touches[0].clientX - rect.left) /
                    rect.width * 600;

                player.x = x - player.w / 2;

            }, { passive: true });

            update();

            return () => {
                running = false;
                cancelAnimationFrame(animation);

                window.removeEventListener("keydown", keydown);
                window.removeEventListener("keyup", keyup);
            };
        }

        function gameReaction() {

            let state = "waiting";
            let start = 0;
            let timer = null;
            let active = true;

            $("gameArea").innerHTML = `
    <div style="text-align:center">

      <button
        id="reactionBox"
        style="
          width:min(90vw,500px);
          height:280px;
          border:0;
          border-radius:24px;
          background:#ef4444;
          color:white;

          font-weight:900;
          cursor:pointer;
        ">
        Wait for green...
      </button>

    </div>
  `;

            const box = $("reactionBox");

            function startRound() {

                state = "waiting";

                box.style.background = "#ef4444";
                box.textContent = "Wait for green...";

                const delay =
                    1500 +
                    Math.random() * 3500;

                timer = setTimeout(() => {

                    if (!active) return;

                    state = "ready";
                    start = performance.now();

                    box.style.background = "#22c55e";
                    box.textContent = "CLICK!";

                }, delay);
            }

            box.onclick = () => {

                if (!active) return;

                if (state === "waiting") {

                    clearTimeout(timer);

                    box.style.background = "#f59e0b";
                    box.textContent = "Too early!";

                    state = "result";

                    setTimeout(startRound, 1000);

                    return;
                }

                if (state === "ready") {

                    const reaction =
                        Math.round(
                            performance.now() - start
                        );

                    state = "result";

                    const best = setBest("reaction", reaction, true);

                    box.style.background = "#3b82f6";
                    box.textContent =
                        reaction + " ms";

                    msg(
                        best
                            ? "🏆 New reaction record!"
                            : "Reaction: " + reaction + " ms"
                    );

        <span>Reaction <strong>${reaction} ms</strong></span>
        <span>Best <strong>${getBest("reaction")} ms</strong></span>
      `);

                    setTimeout(startRound, 1500);
                }
            };

            startRound();

            return () => {
                active = false;
                clearTimeout(timer);
            };

        /* ============================================================
           32. MATH BLITZ
        ============================================================ */

        function gameMathBlitz() {

            let score = 0;
            let lives = 3;
            let time = 30;
            let answer = 0;
            let active = true;
            let timer = null;

            $("gameArea").innerHTML = `
    <div style="text-align:center">

      <div
        id="mathQuestion"
        style="
          font-size:clamp(38px,9vw,65px);

          margin:20px;

        id="mathSubmit"
        class="play"
        style="margin-top:12px">
        Check
      </button>

    </div>
  `;

            const question = $("mathQuestion");
            const input = $("mathAnswer");

            function newQuestion() {

                const a =
                    Math.floor(Math.random() * 20) + 1;

                const b =
                    Math.floor(Math.random() * 20) + 1;

                const type =
                    Math.floor(Math.random() * 4);

                if (type === 0) {

                    answer = a + b;
                    question.textContent =
                        `${a} + ${b}`;

                } else if (type === 1) {

                    const x = Math.max(a, b);
                    const y = Math.min(a, b);

                    answer = x - y;

                    question.textContent =
                        `${x} − ${y}`;

                } else if (type === 2) {

                    const x =
                        Math.floor(Math.random() * 10) + 1;

                    const y =
                        Math.floor(Math.random() * 10) + 1;

                    answer = x * y;

                    question.textContent =
                        `${x} × ${y}`;

                } else {

                    const y =
                        Math.floor(Math.random() * 9) + 1;

                    answer =
                        Math.floor(Math.random() * 10) + 1;

                    const x = y * answer;

                    question.textContent =
                        `${x} ÷ ${y}`;
                }

                input.value = "";
                input.focus();
            }

            function submit() {

                if (!active) return;

                const value =
                    Number(input.value);

                if (value === answer) {

                    score++;
                    msg("✓ Correct");

                } else {

                    lives--;
                    msg("✗ Answer: " + answer);

                    if (lives <= 0) {
                        end();
                        return;
                    }
                }

                update();
                newQuestion();
            }

            function update() {

                setStats(`
      <span>Score <strong>${score}</strong></span>
      <span>Lives <strong>${"❤️".repeat(lives)}</strong></span>
      <span>Time <strong>${time}s</strong></span>
    `);
            }

            function end() {

                active = false;

                clearInterval(timer);

                input.disabled = true;

                const best = setBest("math", score);

                msg(
                    best
                        ? "🏆 New Math Blitz record!"
                        : "Math score: " + score
                );
            }

            $("mathSubmit").onclick = submit;

            input.addEventListener("keydown", e => {
                if (e.key === "Enter") submit();
            });

            timer = setInterval(() => {

                time--;

                update();

                if (time <= 0) end();

            }, 1000);

            newQuestion();
            update();

            return () => {
                active = false;
                clearInterval(timer);
            };
        }

           33. SNAKE
        ============================================================ */

        function gameSnake() {

            const canvas = document.createElement("canvas");

            canvas.width = 400;
            canvas.height = 400;

            canvas.style.cssText = `
    display:block;
    width:min(92vw,400px);
    height:auto;
    margin:auto;
    background:#07100b;
    border-radius:18px;
    border:1px solid var(--border);
    touch-action:none;
  `;

            $("gameArea").appendChild(canvas);

            const ctx = canvas.getContext("2d");

            const SIZE = 20;
            const CELL = 20;

            let snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];

            let direction = {
                x: 1,
                y: 0
            };

            let nextDirection = {
                x: 1,
                y: 0
            };

            let food = {
                x: 15,
                y: 10
            };

            let score = 0;
            let active = true;
            let timer = null;

            function placeFood() {

                do {

                    food = {
                        x: Math.floor(Math.random() * SIZE),
                        y: Math.floor(Math.random() * SIZE)
                    };

                } while (
                    snake.some(
                        s => s.x === food.x && s.y === food.y
                    )
                );
            }

            function draw() {

                ctx.fillStyle = "#07100b";
                ctx.fillRect(0, 0, 400, 400);

                ctx.fillStyle = "#ef4444";

                ctx.fillRect(
                    food.x * CELL + 3,
                    food.y * CELL + 3,
                    CELL - 6,
                    CELL - 6
                );

                snake.forEach((part, i) => {

                    ctx.fillStyle =
                        i === 0
                            ? "#22c55e"
                            : "#16a34a";

                    ctx.fillRect(
                        part.x * CELL + 2,
                        part.y * CELL + 2,
                        CELL - 4,
                        CELL - 4
                    );
                });

                setStats(`
      <span>Score <strong>${score}</strong></span>
      <span>Length <strong>${snake.length}</strong></span>
    `);
            }

            function step() {

                if (!active) return;

                direction = nextDirection;

                const head = {
                    x: snake[0].x + direction.x,
                    y: snake[0].y + direction.y
                };

                if (
                    head.x < 0 ||
                    head.x >= SIZE ||
                    head.y < 0 ||
                    head.y >= SIZE ||
                    snake.some(
                        s => s.x === head.x && s.y === head.y
                    )
                ) {

                    end();
                    return;
                }

                snake.unshift(head);

                if (
                    head.x === food.x &&
                    head.y === food.y
                ) {

                    score++;
                    placeFood();

                } else {

                    snake.pop();
                }

                draw();
            }

            function setDirection(x, y) {

                if (
                    direction.x === -x &&
                    direction.y === -y
                ) return;

                nextDirection = { x, y };
            }

            function key(e) {

                const map = {
                    ArrowUp: [0, -1],
                    ArrowDown: [0, 1],
                    ArrowLeft: [-1, 0],
                    ArrowRight: [1, 0],
                    w: [0, -1],
                    s: [0, 1],
                    a: [-1, 0],
                    d: [1, 0]
                };

                if (map[e.key]) {

                    e.preventDefault();

                    setDirection(
                        map[e.key][0],
                        map[e.key][1]
                    );
                }
            }

            function end() {

                active = false;

                clearInterval(timer);

                const best = setBest("snake", score);

                msg(
                    best
                        ? "🏆 New Snake record!"
                        : "Snake score: " + score
                );
            }

            window.addEventListener("keydown", key);

            placeFood();
            draw();

            timer = setInterval(step, 120);

            return () => {
                active = false;
                clearInterval(timer);
                window.removeEventListener("keydown", key);
            };
        }


        /* ============================================================
           34. BRICK BREAKER
        ============================================================ */

        function gameBreakout() {

            const canvas = document.createElement("canvas");

            canvas.width = 600;
            canvas.height = 420;

            canvas.style.cssText = `
    display:block;
    width:100%;
    max-width:600px;
    margin:auto;
    background:#080b12;
    border-radius:18px;
    border:1px solid var(--border);
    touch-action:none;
  `;

            $("gameArea").appendChild(canvas);

            const ctx = canvas.getContext("2d");

            let paddle = {
                x: 260,
                y: 390,
                w: 80,
                h: 12,
                speed: 8
            };

            let ball = {
                x: 300,
                y: 350,
                vx: 4,
                vy: -4,
                r: 7
            };

            const rows = 5;
            const cols = 8;

            let bricks = [];

            for (let r = 0; r < rows; r++) {

                for (let c = 0; c < cols; c++) {

                    bricks.push({
                        x: 45 + c * 65,
                        y: 40 + r * 25,
                        w: 55,
                        h: 16,
                        alive: true
                    });
                }
            }

            let keys = {};
            let score = 0;
            let active = true;
            let animation = 0;

            function update() {

                if (!active) return;

                if (keys.ArrowLeft || keys.a) {
                    paddle.x -= paddle.speed;
                }

                if (keys.ArrowRight || keys.d) {
                    paddle.x += paddle.speed;
                }

                paddle.x =
                    Math.max(
                        0,
                        Math.min(
                            canvas.width - paddle.w,
                            paddle.x
                        )
                    );

                ball.x += ball.vx;
                ball.y += ball.vy;

                if (
                    ball.x - ball.r < 0 ||
                    ball.x + ball.r > canvas.width
                ) {
                    ball.vx *= -1;
                }

                if (ball.y - ball.r < 0) {
                    ball.vy *= -1;
                }

                if (
                    ball.y + ball.r >= paddle.y &&
                    ball.y + ball.r <= paddle.y + paddle.h &&
                    ball.x >= paddle.x &&
                    ball.x <= paddle.x + paddle.w &&
                    ball.vy > 0
                ) {

                    ball.vy = -Math.abs(ball.vy);

                    const offset =
                        (ball.x - (paddle.x + paddle.w / 2)) /
                        (paddle.w / 2);

                    ball.vx = offset * 5;
                }

                bricks.forEach(brick => {

                    if (!brick.alive) return;

                    if (
                        ball.x + ball.r > brick.x &&
                        ball.x - ball.r < brick.x + brick.w &&
                        ball.y + ball.r > brick.y &&
                        ball.y - ball.r < brick.y + brick.h
                    ) {

                        brick.alive = false;
                        ball.vy *= -1;
                        score++;
                    }
                });

                if (
                    ball.y - ball.r >
                    canvas.height
                ) {

                    end();
                    return;
                }

                if (
                    bricks.every(b => !b.alive)
                ) {

                    end(true);
                    return;
                }

                draw();

                animation =
                    requestAnimationFrame(update);
            }

            function draw() {

                ctx.fillStyle = "#080b12";
                ctx.fillRect(0, 0, 600, 420);

                bricks.forEach(b => {

                    if (!b.alive) return;

                    ctx.fillStyle = "#8b5cf6";

                    ctx.fillRect(
                        b.x,
                        b.y,
                        b.w,
                        b.h
                    );
                });

                ctx.fillStyle = "#22d3ee";

                ctx.fillRect(
                    paddle.x,
                    paddle.y,
                    paddle.w,
                    paddle.h
                );

                ctx.beginPath();

                ctx.fillStyle = "#ffffff";

                ctx.arc(
                    ball.x,
                    ball.y,
                    ball.r,
                    0,
                    Math.PI * 2
                );

                ctx.fill();

                setStats(`
      <span>Bricks <strong>${score}/${bricks.length}</strong></span>
    `);
            }

            function end(win = false) {

                if (!active) return;

                active = false;

                cancelAnimationFrame(animation);

                const best = setBest("breakout", score);

                msg(
                    win
                        ? (best ? "🏆 Perfect!" : "🎉 All bricks destroyed!")
                        : "💥 Game over — " + score
                );
            }

            function keydown(e) {

                keys[e.key] = true;

                if (
                    e.key === "ArrowLeft" ||
                    e.key === "ArrowRight"
                ) {
                    e.preventDefault();
                }
            }

            function keyup(e) {
                keys[e.key] = false;
            }

            window.addEventListener("keydown", keydown);
            window.addEventListener("keyup", keyup);

            canvas.addEventListener("pointermove", e => {

                const rect = canvas.getBoundingClientRect();

                paddle.x =
                    (e.clientX - rect.left) /
                    rect.width * 600 -
                    paddle.w / 2;

            });

            draw();
            update();

            return () => {
                active = false;
                cancelAnimationFrame(animation);
                window.removeEventListener("keydown", keydown);
                window.removeEventListener("keyup", keyup);
            };
        }


        /* ============================================================
           35. SKY HOPPER
        ============================================================ */

        function gameFlappy() {

            const canvas = document.createElement("canvas");

            canvas.width = 480;
            canvas.height = 600;

            canvas.style.cssText = `
    display:block;
    width:min(90vw,360px);
    height:auto;
    margin:auto;
    background:#0f172a;
    border-radius:20px;
    border:1px solid var(--border);
    touch-action:none;
  `;

            $("gameArea").appendChild(canvas);

            const ctx = canvas.getContext("2d");

            let bird = {
                x: 100,
                y: 280,
                vy: 0,
                r: 16
            };

            let pipes = [];
            let score = 0;
            let active = true;
            let animation = 0;
            let spawn = 0;

            function flap() {

                if (active) {
                    bird.vy = -7;
                }
            }

            function update() {

                if (!active) return;

                bird.vy += .35;
                bird.y += bird.vy;

                spawn--;

                if (spawn <= 0) {

                    const gap = 160;

                    const top =
                        70 +
                        Math.random() * 250;

                    pipes.push({
                        x: 500,
                        top,
                        bottom: top + gap,
                        passed: false
                    });

                    spawn = 95;
                }

                pipes.forEach(pipe => {

                    pipe.x -= 3;

                    if (
                        !pipe.passed &&
                        pipe.x + 65 < bird.x
                    ) {

                        pipe.passed = true;
                        score++;
                    }

                    const hitX =
                        bird.x + bird.r > pipe.x &&
                        bird.x - bird.r < pipe.x + 65;

                    const hitY =
                        bird.y - bird.r < pipe.top ||
                        bird.y + bird.r > pipe.bottom;

                    if (hitX && hitY) {
                        end();
                    }
                });

                pipes = pipes.filter(
                    p => p.x > -100
                );

                if (
                    bird.y - bird.r < 0 ||
                    bird.y + bird.r > canvas.height
                ) {
                    end();
                }

                draw();

                animation =
                    requestAnimationFrame(update);
            }

            function draw() {

                ctx.fillStyle = "#0f172a";
                ctx.fillRect(0, 0, 480, 600);

                pipes.forEach(pipe => {

                    ctx.fillStyle = "#22c55e";

                    ctx.fillRect(
                        pipe.x,
                        0,
                        65,
                        pipe.top
                    );

                    ctx.fillRect(
                        pipe.x,
                        pipe.bottom,
                        65,
                        600 - pipe.bottom
                    );
                });

                ctx.beginPath();

                ctx.fillStyle = "#facc15";

                ctx.arc(
                    bird.x,
                    bird.y,
                    bird.r,
                    0,
                    Math.PI * 2
                );

                ctx.fill();

                setStats(`
      <span>Score <strong>${score}</strong></span>
      <span>Best <strong>${getBest("flappy")}</strong></span>
    `);
            }

            function end() {

                if (!active) return;

                active = false;

                cancelAnimationFrame(animation);

                const best = setBest("flappy", score);

                msg(
                    best
                        ? "🏆 New Sky Hopper record!"
                        : "Score: " + score
                );
            }

            window.addEventListener("keydown", e => {

                if (
                    e.code === "Space" ||
                    e.key === "ArrowUp"
                ) {

                    e.preventDefault();
                    flap();
                }

            });

            canvas.addEventListener("pointerdown", flap);

            draw();
            update();

            return () => {
                active = false;
                cancelAnimationFrame(animation);
            };
        }

            const display = $("wordDisplay");
            const letters = $("letterButtons");

            function render() {

                display.textContent =
                    word
                        .split("")
                        .map(c =>
                            guessed.has(c)
                                ? c.toUpperCase()
                                : "_"
                        )
                        .join(" ");

                setStats(`
      <span>Misses <strong>${misses}/${maxMisses}</strong></span>

                const letter =
                    String.fromCharCode(i)
                        .toLowerCase();

                const button = document.createElement("button");

                button.style.cssText = `

      height:42px;

      border:1px solid var(--border);
      background:#111827;
      color:white;
      font-weight:800;
      cursor:pointer;
    `;

                button.onclick = () => {

                    if (!active) return;

                    button.disabled = true;

                    if (word.includes(letter)) {

                        guessed.add(letter);

                    } else {

                        misses++;
                    }

                    render();

                    const won =
                        word
                            .split("")
                            .every(c => guessed.has(c));

                    if (won) {

                        active = false;

                        const score =
                            Math.max(
                                10,
                                100 - misses * 10
                            );

                        const best = setBest(
                            "wordguess",
                            score
                        );

                        msg(
                            best
                                ? "🏆 New Word Guess record!"
                                : "🎉 Word solved!"
                        );
                    }

                    if (misses >= maxMisses) {

                        active = false;

                        msg(
                            "The word was " + word.toUpperCase()
                        );
                    }
                };

                letters.appendChild(button);
            }

            render();

            return () => {
                active = false;
            };
        }

            function draw() {

                ctx.fillStyle = "#080b12";
                ctx.fillRect(0, 0, 500, 500);

                ctx.fillStyle = "#22d3ee";

                ctx.fillRect(
                    player.x,
                    player.y,
                    player.w,
                    player.h
                );

                blocks.forEach(block => {

                    ctx.fillStyle = "#f43f5e";

                    ctx.fillRect(
                        block.x,
                        block.y,
                        block.w,
                        block.h
                    );
                });

                setStats(`
      <span>Score <strong>${Math.floor(score / 10)}</strong></span>
      <span>Time <strong>${time}s</strong></span>
    `);
            }

            function end() {

                if (!active) return;

                active = false;

                cancelAnimationFrame(animation);
                clearInterval(timer);

                const finalScore =
                    Math.floor(score / 10);

                const best =
                    setBest("avoid", finalScore);

                msg(
                    best
                        ? "🏆 New Block Dodge record!"
                        : "Score: " + finalScore
                );
            }

            function keydown(e) {

                keys[e.key] = true;

                if (
                    e.key === "ArrowLeft" ||
                    e.key === "ArrowRight"
                ) {
                    e.preventDefault();
                }
            }

            function keyup(e) {
                keys[e.key] = false;
            }

            window.addEventListener(
                "keydown",
                keydown
            );

            window.addEventListener(
                "keyup",
                keyup
            );

            canvas.addEventListener(
                "pointermove",
                e => {

                    const rect =
                        canvas.getBoundingClientRect();

                    player.x =
                        (e.clientX - rect.left) /
                        rect.width * 500 -
                        player.w / 2;
                }
            );

            timer = setInterval(() => {

                time--;

                if (time <= 0) {

                    end();
                    return;
                }

            }, 1000);

            draw();
            update();

            return () => {
                active = false;

                cancelAnimationFrame(animation);
                clearInterval(timer);

                window.removeEventListener(
                    "keydown",
                    keydown
                );

                window.removeEventListener(
                    "keyup",
                    keyup
                );
            };
        }




        /* ============================================================
           END — GAMES 31–40
        ============================================================ */


    </script>
