<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>GetKit Tools — 64 Free Online Tools</title>

<meta name="description"
content="Use 64 free online tools for PDFs, images, text, calculators, conversions, developers and everyday tasks. Fast, simple and easy to use.">

<meta name="robots" content="index,follow">

<style>
:root{
  --bg:#08090d;
  --panel:#101218;
  --panel2:#151821;
  --border:rgba(255,255,255,.09);
  --text:#f5f7fb;
  --muted:#9299a8;
  --purple:#8b5cf6;
  --blue:#4f7cff;
  --gradient:linear-gradient(135deg,#8b5cf6,#4f7cff);
  --danger:#f87171;
  --success:#5ee6a8;
  --radius:18px;
}

*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{
  background:
    radial-gradient(circle at 50% -10%,rgba(104,77,190,.16),transparent 35%),
    var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  line-height:1.5;
}

button,input,textarea,select{font:inherit}

button{cursor:pointer}

a{text-decoration:none;color:inherit}

.container{
  width:min(1160px,calc(100% - 32px));
  margin:auto;
}

/* NAV */

header{
  position:sticky;
  top:0;
  z-index:100;
  backdrop-filter:blur(18px);
  background:rgba(8,9,13,.82);
  border-bottom:1px solid rgba(255,255,255,.06);
}

.nav{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:25px;
  font-weight:850;
  letter-spacing:-1px;
}

.logo span{
  background:var(--gradient);
  -webkit-background-clip:text;
  background-clip: text;
  color: transparent;
}

.home{
  color:var(--muted);
  font-size:14px;
}

.home:hover{color:#fff}

/* HERO */

.hero{
  text-align:center;
  padding:70px 0 35px;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:7px 13px;
  border-radius:999px;
  color:#bba8ff;
  background:rgba(139,92,246,.09);
  border:1px solid rgba(139,92,246,.2);
  font-size:12px;
  font-weight:700;
}

.dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#9b7aff;
  box-shadow:0 0 12px #9b7aff;
}

h1{
  font-size:clamp(42px,7vw,68px);
  letter-spacing:-3px;
  line-height:1;
  margin:20px auto 14px;
}

.gradient{
  background:var(--gradient);
  -webkit-background-clip:  text;
  background-clip:  text;
  color:transparent;
}

.hero p{
  max-width:650px;
  margin:auto;
  color:var(--muted);
  font-size:16px;
}

/* SEARCH */

.search-area{
  max-width:760px;
  margin:30px auto 0;
  position:relative;
}

.search{
  display:flex;
  align-items:center;
  background:#11131a;
  border:1px solid rgba(255,255,255,.11);
  border-radius:16px;
  padding:6px;
  transition:.2s;
}

.search:focus-within{
  border-color:rgba(139,92,246,.5);
  box-shadow:0 0 35px rgba(139,92,246,.1);
}

.search-icon{
  width:45px;
  text-align:center;
  color:#777f90;
  font-size:20px;
}

.search input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:none;
  color:white;
  padding:13px 5px;
  font-size:15px;
}

.search input::placeholder{color:#687082}

.clear{
  display:none;
  border:0;
  background:none;
  color:#777f90;
  padding:10px;
}

.search-results{
  position:absolute;
  z-index:50;
  top:calc(100% + 9px);
  left:0;
  right:0;
  background:#11131a;
  border:1px solid var(--border);
  border-radius:15px;
  padding:7px;
  box-shadow:0 25px 70px rgba(0,0,0,.55);
  display:none;
  text-align:left;
  max-height:360px;
  overflow:auto;
}

.search-result{
  display:flex;
  gap:12px;
  align-items:center;
  padding:11px;
  border-radius:11px;
  transition:.15s;
}

.search-result:hover{
  background:rgba(255,255,255,.055);
}

.result-icon{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  background:rgba(139,92,246,.08);
  border-radius:10px;
}

.result-name{font-size:14px;font-weight:700}
.result-cat{font-size:11px;color:#70788a}

/* QUICK ACTIONS */

.quick{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  margin-top:14px;
}

.chip{
  border:1px solid var(--border);
  background:rgba(255,255,255,.025);
  color:#9098a8;
  border-radius:999px;
  padding:7px 12px;
  font-size:12px;
  transition:.2s;
}

.chip:hover,.chip.active{
  color:white;
  border-color:rgba(139,92,246,.4);
  background:rgba(139,92,246,.08);
}

/* TOOLBAR */

.toolbar{
  margin:28px 0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  flex-wrap:wrap;
}

.count{
  color:var(--muted);
  font-size:13px;
}

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.filter{
  border:1px solid var(--border);
  background:#0e1016;
  color:#858d9d;
  padding:8px 12px;
  border-radius:10px;
  font-size:12px;
  transition:.2s;
}

.filter:hover,.filter.active{
  color:#fff;
  border-color:rgba(139,92,246,.4);
  background:rgba(139,92,246,.09);
}

/* POPULAR */

.popular{
  margin:20px 0 40px;
}

.section-title{
  font-size:23px;
  letter-spacing:-.7px;
  margin-bottom:14px;
}

.popular-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:11px;
}

.popular-card{
  padding:15px;
  border:1px solid var(--border);
  background:#101218;
  border-radius:15px;
  display:flex;
  gap:11px;
  align-items:center;
  transition:.2s;
}

.popular-card:hover{
  transform:translateY(-2px);
  border-color:rgba(139,92,246,.28);
}

.small-icon{
  width:38px;
  height:38px;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:rgba(139,92,246,.08);
  flex:none;
}

.popular-card strong{
  font-size:13px;
}

.popular-card small{
  display:block;
  color:#727a8b;
  font-size:10px;
  margin-top:2px;
}

/* TOOLS */

.category-title{
  margin:38px 0 13px;
  font-size:19px;
  letter-spacing:-.4px;
}

.tool-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.tool{
  min-height:158px;
  border:1px solid var(--border);
  background:
    linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.015));
  border-radius:17px;
  padding:18px;
  transition:.22s;
  cursor:pointer;
  display:flex;
  flex-direction:column;
}

.tool:hover{
  transform:translateY(-3px);
  border-color:rgba(139,92,246,.27);
  background:#131620;
}

.tool-icon{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  background:rgba(255,255,255,.045);
  border-radius:11px;
  font-size:19px;
  margin-bottom:15px;
}

.tool h3{
  font-size:14px;
  margin-bottom:5px;
}

.tool p{
  color:#7f8797;
  font-size:11px;
  line-height:1.5;
}

.tool-footer{
  margin-top:auto;
  padding-top:12px;
  color:#7e6be0;
  font-size:11px;
  font-weight:700;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(8px);
}

.modal.open{display:flex}

.modal-box{
  width:min(720px,100%);
  max-height:90vh;
  overflow:auto;
  background:#101218;
  border:1px solid rgba(255,255,255,.11);
  border-radius:22px;
  box-shadow:0 30px 100px rgba(0,0,0,.65);
}

.modal-head{
  position:sticky;
  top:0;
  z-index:2;
  background:rgba(16,18,24,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--border);
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal-title{
  display:flex;
  align-items:center;
  gap:12px;
}

.modal-title-icon{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:11px;
  background:rgba(139,92,246,.1);
  font-size:20px;
}

.modal-title h2{
  font-size:17px;
}

.modal-title p{
  color:#737b8c;
  font-size:11px;
}

.close{
  width:35px;
  height:35px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.04);
  color:#a3aab8;
  border-radius:9px;
  font-size:18px;
}

.close:hover{color:#fff}

.modal-body{
  padding:20px;
}

/* TOOL UI */

.tool-description{
  color:#8b93a3;
  font-size:13px;
  margin-bottom:18px;
}

textarea,
.tool-input,
.tool-select{
  width:100%;
  border:1px solid rgba(255,255,255,.1);
  background:#0b0d12;
  color:#f5f7fb;
  outline:0;
  border-radius:12px;
  padding:12px;
}

textarea{
  min-height:180px;
  resize:vertical;
}

textarea:focus,
.tool-input:focus,
.tool-select:focus{
  border-color:rgba(139,92,246,.45);
}

.tool-row{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:10px;
}

.tool-row.three{
  grid-template-columns:repeat(3,1fr);
}

.field label{
  display:block;
  color:#7d8595;
  font-size:11px;
  margin-bottom:5px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:13px;
}

.primary,
.secondary,
.danger{
  border-radius:10px;
  padding:10px 15px;
  border:1px solid var(--border);
  font-size:12px;
  font-weight:700;
}

.primary{
  color:white;
  background:var(--gradient);
  border:0;
}

.secondary{
  background:rgba(255,255,255,.045);
  color:#b4bac6;
}

.danger{
  color:#fca5a5;
  background:rgba(248,113,113,.06);
}

.primary:hover{filter:brightness(1.08)}
.secondary:hover{background:rgba(255,255,255,.08)}

.output{
  margin-top:15px;
  padding:14px;
  min-height:50px;
  border-radius:12px;
  border:1px solid var(--border);
  background:#0b0d12;
  color:#c8ced9;
  white-space:pre-wrap;
  overflow:auto;
  font-size:13px;
}

.output.success{border-color:rgba(94,230,168,.25)}
.output.error{border-color:rgba(248,113,113,.3);color:#fca5a5}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:12px;
}

.stat{
  background:#0b0d12;
  border:1px solid var(--border);
  border-radius:11px;
  padding:12px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:18px;
}

.stat small{
  color:#70788a;
  font-size:10px;
}

.dropzone{
  border:1px dashed rgba(255,255,255,.17);
  border-radius:14px;
  padding:32px 18px;
  text-align:center;
  background:rgba(255,255,255,.018);
  cursor:pointer;
  transition:.2s;
}

.dropzone:hover,
.dropzone.drag{
  border-color:rgba(139,92,246,.55);
  background:rgba(139,92,246,.05);
}

.dropzone strong{
  display:block;
  font-size:14px;
}

.dropzone span{
  display:block;
  color:#737b8b;
  font-size:11px;
  margin-top:5px;
}

.file-info{
  margin-top:10px;
  color:#818999;
  font-size:11px;
}

.preview{
  max-width:100%;
  max-height:300px;
  display:block;
  margin:14px auto 0;
  border-radius:10px;
}

.color-result{
  display:flex;
  align-items:center;
  gap:15px;
}

.color-swatch{
  width:80px;
  height:80px;
  border-radius:15px;
  border:1px solid var(--border);
}

/* FOOTER */

footer{
  margin-top:70px;
  padding:38px 0;
  border-top:1px solid rgba(255,255,255,.06);
  color:#656d7d;
  font-size:12px;
}

.footer-inner{
  display:flex;
  justify-content:space-between;
  gap:20px;
}

/* RESPONSIVE */

@media(max-width:1000px){
  .tool-grid{grid-template-columns:repeat(3,1fr)}
  .popular-grid{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:700px){
  .tool-grid{grid-template-columns:repeat(2,1fr)}
  .popular-grid{grid-template-columns:1fr}
  .tool-row,.tool-row.three{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  h1{letter-spacing:-2px}
}

@media(max-width:500px){
  .container{width:min(100% - 22px,1160px)}
  .tool-grid{grid-template-columns:1fr}
  .hero{padding-top:48px}
  .hero p{font-size:14px}
  .toolbar{align-items:flex-start}
  .filters{width:100%}
  .filter{flex:1;text-align:center}
}

/* HIDDEN */

.hidden{display:none!important}
</style>
</head>

/* =========================================================
   STATE
========================================================= */

let currentCategory="all";
let currentSearch="";


/* =========================================================
   DIRECTORY
========================================================= */

const groups=[
  "PDF & Documents",
  "Image Tools",
  "Text Tools",
  "Calculators & Converters",
  "Developer & Web"
];

function filteredTools(){

  return tools.filter(t=>{

    const categoryMatch=
      currentCategory==="all" ||
      t.category===currentCategory;

    const q=currentSearch.toLowerCase().trim();

    const searchMatch=!q ||
      (
        t.name+
        " "+
        t.category+
        " "+
        t.desc
      ).toLowerCase().includes(q);

    return categoryMatch && searchMatch;
  });
}


function renderPopular(){

  const popularIds=[
    "pdf-compressor",
    "image-compressor",
    "word-counter",
    "percentage",
    "age",
    "json-formatter",
    "qr-code-generator"
  ];

  const popular=tools.filter(t=>popularIds.includes(t.id));

  document.getElementById("popularGrid").innerHTML=
    popular.slice(0,8).map(t=>`

      <div class="popular-card" onclick="openTool('${t.id}')">

        <div class="small-icon">${t.icon}</div>

        <div>
          <strong>${escapeHTML(t.name)}</strong>
          <small>${escapeHTML(t.category)}</small>
        </div>

      </div>

    `).join("");
}


function renderTools(){

  const list=filteredTools();

  document.getElementById("count").textContent=list.length;

  const groupsHTML=groups.map(category=>{

    const items=list.filter(t=>t.category===category);

    if(!items.length)return "";

    return `

      <div class="tool-category">

        <h2 class="category-title">
          ${category}
        </h2>

        <div class="tool-grid">

          ${items.map(t=>`

            <article
              class="tool"
              onclick="openTool('${t.id}')"
              tabindex="0"
              role="button"
              aria-label="Open ${escapeHTML(t.name)}"
              onkeydown="if(event.key==='Enter')openTool('${t.id}')"
            >

              <div class="tool-icon">
                ${t.icon}
              </div>

              <h3>${escapeHTML(t.name)}</h3>

              <p>${escapeHTML(t.desc)}</p>

              <div class="tool-footer">
                Open Tool →
              </div>

            </article>

          `).join("")}

        </div>

      </div>

    `;

  }).join("");

  document.getElementById("toolGroups").innerHTML=
    groupsHTML ||
    `<div style="text-align:center;padding:60px;color:#777">
      No tools found. Try another search.
    </div>`;
}


function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =========================================================
   FILTERS
========================================================= */

document.querySelectorAll(".filter").forEach(button=>{

  button.addEventListener("click",()=>{

    document
      .querySelectorAll(".filter")
      .forEach(b=>b.classList.remove("active"));

    button.classList.add("active");

    currentCategory=button.dataset.category;

    renderTools();

    document
      .getElementById("directory")
      .scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

  });

});


/* =========================================================
   SEARCH
========================================================= */

const search=document.getElementById("search");
const results=document.getElementById("searchResults");
const clearSearch=document.getElementById("clearSearch");

search.addEventListener("input",()=>{

  currentSearch=search.value;

  clearSearch.style.display=
    currentSearch ? "block":"none";

  renderTools();

  const q=currentSearch.toLowerCase().trim();

  if(!q){

    results.style.display="none";
    return;
  }

  const matches=
    tools
      .filter(t=>
        (
          t.name+
          " "+
          t.category+
          " "+
          t.desc
        ).toLowerCase().includes(q)
      )
      .slice(0,8);

  results.innerHTML=matches.length
    ? matches.map(t=>`

      <div
        class="search-result"
        onclick="openTool('${t.id}')"
      >

        <div class="result-icon">${t.icon}</div>

        <div>
          <div class="result-name">
            ${escapeHTML(t.name)}
          </div>

          <div class="result-cat">
            ${escapeHTML(t.category)}
          </div>
        </div>

      </div>

    `).join("")
    :
    `<div style="padding:15px;color:#777">
      No matching tools found.
    </div>`;

  results.style.display="block";

});


clearSearch.addEventListener("click",()=>{

  search.value="";
  currentSearch="";
  clearSearch.style.display="none";
  results.style.display="none";
  renderTools();

  search.focus();

});


document.addEventListener("click",e=>{

  if(!e.target.closest(".search-area")){
    results.style.display="none";
  }

});


document.querySelectorAll("[data-quick]").forEach(button=>{

  button.addEventListener("click",()=>{

    const value=button.dataset.quick;

    search.value=value;
    currentSearch=value;

    clearSearch.style.display="block";

    renderTools();

    search.focus();

  });

});


/* =========================================================
   MODAL
========================================================= */

const modal=document.getElementById("modal");

function openTool(id){

  const tool=tools.find(t=>t.id===id);

  if(!tool)return;

  document.getElementById("modalIcon").textContent=tool.icon;
  document.getElementById("modalTitle").textContent=tool.name;
  document.getElementById("modalCategory").textContent=tool.category;

  document.getElementById("modalBody").innerHTML=
    buildToolUI(tool);

  modal.classList.add("open");

  document.body.style.overflow="hidden";

  attachToolEvents(tool);

}


function closeModal(){

  modal.classList.remove("open");
  document.body.style.overflow="";

}


document.getElementById("closeModal")
  .addEventListener("click",closeModal);


modal.addEventListener("click",e=>{

  if(e.target===modal)closeModal();

});


document.addEventListener("keydown",e=>{

  if(e.key==="Escape" && modal.classList.contains("open")){
    closeModal();
  }

});

========================================================= */

function getText(){
  return document.getElementById("mainText")?.value || "";
}


function attachWordCounter(){

  const text=document.getElementById("mainText");

  function update(){

    const value=text.value.trim();

    const words=value
      ? value.split(/\s+/).length
      : 0;

    const chars=text.value.length;

    const noSpaces=text.value
      .replace(/\s/g,"").length;

    const sentences=value
      ? (value.match(/[.!?]+(?=\s|$)/g)||[]).length
      : 0;

    document.getElementById("words").textContent=words;
    document.getElementById("chars").textContent=chars;
    document.getElementById("charsNo").textContent=noSpaces;
    document.getElementById("sentences").textContent=sentences;

    const mins=words
      ? Math.max(1,Math.ceil(words/200))
      : 0;

    document.getElementById("output").textContent=
      `Estimated reading time: ${mins} minute${mins===1?"":"s"}`;

  }

  text.addEventListener("input",update);

  document.getElementById("runTool").onclick=update;

}


function attachCase(){

  document.querySelectorAll("[data-case]").forEach(button=>{

    button.onclick=()=>{

      const text=getText();

      let result=text;

      switch(button.dataset.case){

        case"upper":
          result=text.toUpperCase();
          break;

        case"lower":
          result=text.toLowerCase();
          break;

        case"title":
          result=text.toLowerCase()
            .replace(/\b\w/g,c=>c.toUpperCase());
          break;

        case"sentence":
          result=text
            .toLowerCase()
            .replace(/(^\s*\w|[.!?]\s+\w)/g,
              m=>m.toUpperCase()
            );
          break;

      }

      document.getElementById("output").textContent=result;

    };

  });

}


function attachSimpleText(type){

  const button=document.getElementById("runTool");

  button.onclick=()=>{

    const text=getText();

    let result="";

    switch(type){

      case"upper":
        result=text.toUpperCase();
        break;

      case"lower":
        result=text.toLowerCase();
        break;

      case"title":
        result=text.toLowerCase()
          .replace(/\b\w/g,c=>c.toUpperCase());
        break;

      case"duplicates":
        result=[
          ...new Set(text.split(/\r?\n/))
        ].join("\n");
        break;

      case"spaces":
        result=text.replace(/[ \t]+/g," ").trim();
        break;

      case"sort":
        result=text
          .split(/\r?\n/)
          .sort((a,b)=>a.localeCompare(b))
          .join("\n");
        break;

      case"reverse":
        result=[...text].reverse().join("");
        break;

      case"slug":
        result=text
          .toLowerCase()
          .trim()
          .replace(/[^\w\s-]/g,"")
          .replace(/[\s_-]+/g,"-")
          .replace(/^-+|-+$/g,"");
        break;

      case"reading":

        const words=text.trim()
          ? text.trim().split(/\s+/).length
          : 0;

        result=
          `Words: ${words}\n`+
          `Estimated reading time: ${Math.max(1,Math.ceil(words/200))} minute(s)`;

        break;

    }

    document.getElementById("output").textContent=result;

  };

}

function attachAge(){

  document.getElementById("runTool").onclick=()=>{

    const input=document.getElementById("date").value;

    if(!input){
      showError("Choose your date of birth.");
      return;
    }

    const dob=new Date(input+"T00:00:00");
    const now=new Date();

    let age=now.getFullYear()-dob.getFullYear();

    const month=now.getMonth()-dob.getMonth();

    if(
      month<0 ||
      (month===0 && now.getDate()<dob.getDate())
    ){
      age--;
    }

    showResult(`Your age is approximately ${age} years.`);

  };

}


function attachBMI(){

  document.getElementById("runTool").onclick=()=>{

    const weight=num("weight");
    const height=num("height");

    if(weight<=0||height<=0){
      showError("Enter valid height and weight.");
      return;
    }

    const bmi=
      weight/Math.pow(height/100,2);

    let category=
      bmi<18.5?"Underweight":
      bmi<25?"Normal range":
      bmi<30?"Overweight":
      "Obesity";

    showResult(
      `BMI: ${bmi.toFixed(1)}\nCategory: ${category}`
    );

  };

}


function attachDiscount(){

  document.getElementById("runTool").onclick=()=>{

    const price=num("price");
    const discount=num("discount");

    if(price<0||discount<0){
      showError("Enter valid values.");
      return;
    }

    const saved=price*discount/100;
    const final=price-saved;

    showResult(
      `You save: ${saved.toFixed(2)}\n`+
      `Final price: ${final.toFixed(2)}`
    );

  };

}


function attachTip(){

  document.getElementById("runTool").onclick=()=>{

    const bill=num("bill");
    const tip=num("tip");
    const people=Math.max(1,num("people")||1);

    if(bill<0||tip<0){
      showError("Enter valid values.");
      return;
    }

    const tipAmount=bill*tip/100;
    const total=bill+tipAmount;

    showResult(
      `Tip: ${tipAmount.toFixed(2)}\n`+
      `Total: ${total.toFixed(2)}\n`+
      `Per person: ${(total/people).toFixed(2)}`
    );

  };

}


function attachLoan(){

  document.getElementById("runTool").onclick=()=>{

    const P=num("principal");
    const annual=num("rate");
    const years=num("years");

    if(P<=0||annual<0||years<=0){
      showError("Enter valid loan details.");
      return;
    }

    const r=annual/100/12;
    const n=years*12;

    let payment;

    if(r===0){
      payment=P/n;
    }else{
      payment=
        P*r*Math.pow(1+r,n)/
        (Math.pow(1+r,n)-1);
    }

    showResult(
      `Estimated monthly payment: ${payment.toFixed(2)}\n`+
      `Total payments: ${(payment*n).toFixed(2)}`
    );

  };

}


function attachCompound(){

  document.getElementById("runTool").onclick=()=>{

    const P=num("principal");
    const r=num("rate")/100;
    const t=num("years");
    const n=num("frequency");

    if(P<=0||t<=0||n<=0){
      showError("Enter valid values.");
      return;
    }

    const amount=P*Math.pow(1+r/n,n*t);
    const interest=amount-P;

    showResult(
      `Final amount: ${amount.toFixed(2)}\n`+
      `Interest earned: ${interest.toFixed(2)}`
    );

  };

}

function attachColor(){

  document.getElementById("runTool").onclick=()=>{

    let hex=
      document.getElementById("hex").value.trim();

    if(!/^#?[0-9a-fA-F]{6}$/.test(hex)){
      showError("Enter a valid 6-digit HEX color.");
      return;
    }

    hex=hex.replace("#","");

    const r=parseInt(hex.slice(0,2),16);
    const g=parseInt(hex.slice(2,4),16);
    const b=parseInt(hex.slice(4,6),16);

    const max=Math.max(r,g,b)/255;
    const min=Math.min(r,g,b)/255;

    const l=(max+min)/2;

    let h=0;
    let s=0;

    if(max!==min){

      const d=max-min;

      s=l>.5
        ?d/(2-max-min)
        :d/(max+min);

      switch(max){

        case r/255:
          h=(g-b)/255/d+
            (g<b?6:0);
          break;

        case g/255:
          h=(b-r)/255/d+2;
          break;

        case b/255:
          h=(r-g)/255/d+4;
          break;

      }

      h/=6;

    }

    showResult(
      `HEX: #${hex.toUpperCase()}\n`+
      `RGB: rgb(${r}, ${g}, ${b})\n`+
      `HSL: hsl(${Math.round(h*360)}, ${Math.round(s*100)}%, ${Math.round(l*100)}%)`
    );

  };

}

    let password="";

    const bytes=new Uint32Array(length);

    crypto.getRandomValues(bytes);

    for(let i=0;i<length;i++){
      password+=chars[bytes[i]%chars.length];
    }

    showResult(password);

  };

}

let currentImage=null;
let currentImageFile=null;
let currentCanvasData=null;

function attachImage(tool){

  const drop=document.getElementById("dropzone");
  const input=document.getElementById("file");
  const info=document.getElementById("fileInfo");
  const preview=document.getElementById("preview");
  const canvas=document.getElementById("canvas");

  drop.onclick=()=>input.click();

  drop.ondragover=e=>{
    e.preventDefault();
    drop.classList.add("drag");
  };

  drop.ondragleave=()=>{
    drop.classList.remove("drag");
  };

  drop.ondrop=e=>{

    e.preventDefault();

    drop.classList.remove("drag");

    if(e.dataTransfer.files[0]){
      loadImage(e.dataTransfer.files[0]);
    }

  };

  input.onchange=()=>{
    if(input.files[0]){
      loadImage(input.files[0]);
    }
  };


  function loadImage(file){

    if(!file.type.startsWith("image/")){
      showError("Please choose an image.");
      return;
    }

    currentImageFile=file;

    const url=URL.createObjectURL(file);

    const img=new Image();

    img.onload=()=>{

      currentImage=img;

      preview.src=url;
      preview.hidden=false;

      info.textContent=
        `${file.name} • ${img.width} × ${img.height} • ${formatBytes(file.size)}`;

      if(
        tool.type==="image-resizer" &&
        document.getElementById("imgWidth")
      ){

        document.getElementById("imgWidth").value=img.width;
        document.getElementById("imgHeight").value=img.height;

      }

    };

    img.src=url;

  }


  document.getElementById("runTool").onclick=()=>{

    if(!currentImage){

      showError("Choose an image first.");
      return;

    }

    if(tool.type==="color-picker"){

      const ctx=canvas.getContext("2d");

      canvas.width=currentImage.width;
      canvas.height=currentImage.height;

      ctx.drawImage(currentImage,0,0);

      const x=Math.floor(currentImage.width/2);
      const y=Math.floor(currentImage.height/2);

      const pixel=ctx.getImageData(x,y,1,1).data;

      const hex=
        "#"+
        [pixel[0],pixel[1],pixel[2]]
          .map(v=>v.toString(16).padStart(2,"0"))
          .join("");

      showResult(
        `Center pixel color: ${hex.toUpperCase()}\n`+
        `RGB: rgb(${pixel[0]}, ${pixel[1]}, ${pixel[2]})`
      );

      return;

    }


    processImage();

  };


  document
    .querySelectorAll("[data-transform]")
    .forEach(btn=>{

      btn.onclick=()=>processImage(btn.dataset.transform);

    });


  function processImage(transform){

    let width=currentImage.width;
    let height=currentImage.height;

    const ctx=canvas.getContext("2d");

    if(
      transform==="rotate90" ||
      transform==="rotate270"
    ){
      [width,height]=[height,width];
    }

    canvas.width=width;
    canvas.height=height;

    ctx.clearRect(0,0,width,height);

    ctx.save();

    if(transform==="rotate90"){

      ctx.translate(width,0);
      ctx.rotate(Math.PI/2);

    }

    else if(transform==="rotate180"){

      ctx.translate(width,height);
      ctx.rotate(Math.PI);

    }

    else if(transform==="flipH"){

      ctx.translate(width,0);
      ctx.scale(-1,1);

    }

    else if(transform==="flipV"){

      ctx.translate(0,height);
      ctx.scale(1,-1);

    }

    let drawWidth=currentImage.width;
    let drawHeight=currentImage.height;

    if(tool.type==="image-resizer"){

      drawWidth=
        Number(document.getElementById("imgWidth").value) ||
        currentImage.width;

      drawHeight=
        Number(document.getElementById("imgHeight").value) ||
        currentImage.height;

      canvas.width=drawWidth;
      canvas.height=drawHeight;

    }

    ctx.drawImage(
      currentImage,
      0,
      0,
      drawWidth,
      drawHeight
    );

    ctx.restore();

    currentCanvasData=canvas.toDataURL(
      document.getElementById("format")?.value ||
      "image/jpeg",
      tool.type==="image-compressor"?.72:.92
    );

    preview.src=currentCanvasData;

    showResult(
      `Processed successfully.\n`+
      `Output size: ${formatBytes(
        Math.round(
          currentCanvasData.length*0.75
        )
      )}`
    );

  }


  const download=
    document.getElementById("downloadResult");

  if(download){

    download.onclick=()=>{

      if(!currentCanvasData){

        if(currentImage){
          processImage();
        }else{
          showError("Process an image first.");
          return;
        }

      }

      downloadData(
        currentCanvasData,
        "getkit-image."+
        (
          document.getElementById("format")?.value==="image/png"
          ?"png":
          document.getElementById("format")?.value==="image/webp"
          ?"webp":"jpg"
        )
      );

    };

  }

}


/* =========================================================
   PDF TOOLS
========================================================= */

let pdfFiles=[];

function attachPDF(tool){

  const drop=document.getElementById("pdfDrop");
  const input=document.getElementById("pdfFiles");
  const info=document.getElementById("pdfInfo");

  drop.onclick=()=>input.click();

  drop.ondragover=e=>{
    e.preventDefault();
    drop.classList.add("drag");
  };

  drop.ondragleave=()=>{
    drop.classList.remove("drag");
  };

  drop.ondrop=e=>{

    e.preventDefault();
    drop.classList.remove("drag");

    const files=
      [...e.dataTransfer.files]
      .filter(f=>f.type==="application/pdf");

    setPDFs(files);

  };

  input.onchange=()=>{
    setPDFs([...input.files]);
  };


  function setPDFs(files){

    pdfFiles=files;

    info.textContent=
      files.length
      ? files.map(f=>
          `${f.name} (${formatBytes(f.size)})`
        ).join(" • ")
      : "No PDF selected.";

  }


  document.getElementById("runTool").onclick=
    async()=>{

      if(!pdfFiles.length){

        showError("Choose a PDF first.");
        return;

      }

      try{

        if(tool.type==="pdf-merger"){

          if(pdfFiles.length<2){
            showError("Choose at least two PDFs.");
            return;
          }

          const merged=
            await PDFLib.PDFDocument.create();

          for(const file of pdfFiles){

            const bytes=
              await file.arrayBuffer();

            const pdf=
              await PDFLib.PDFDocument.load(bytes);

            const pages=
              await merged.copyPages(
                pdf,
                pdf.getPageIndices()
              );

            pages.forEach(p=>merged.addPage(p));

          }

          const bytes=
            await merged.save();

          currentPDFBytes=bytes;

          showResult(
            `Merged ${pdfFiles.length} PDFs successfully.\n`+
            `${merged.getPageCount()} pages total.`
          );

          return;

        }


        if(
          tool.type==="pdf-splitter" ||
          tool.type==="pdf-delete" ||
          tool.type==="pdf-rotator"
        ){

          const bytes=
            await pdfFiles[0].arrayBuffer();

          const pdf=
            await PDFLib.PDFDocument.load(bytes);

          const pageCount=pdf.getPageCount();

          const requested=
            parsePages(
              document.getElementById("pages").value,
              pageCount
            );

          if(!requested.length){

            showError(
              `Enter page numbers between 1 and ${pageCount}.`
            );

            return;

          }


          if(tool.type==="pdf-delete"){

            const keep=
              Array.from(
                {length:pageCount},
                (_,i)=>i
              ).filter(i=>!requested.includes(i+1));

            const output=
              await PDFLib.PDFDocument.create();

            const pages=
              await output.copyPages(pdf,keep);

            pages.forEach(p=>output.addPage(p));

            currentPDFBytes=
              await output.save();

            showResult(
              `Removed ${requested.length} page(s).`
            );

            return;

          }


          if(tool.type==="pdf-splitter"){

            const output=
              await PDFLib.PDFDocument.create();

            const pages=
              await output.copyPages(
                pdf,
                requested.map(p=>p-1)
              );

            pages.forEach(p=>output.addPage(p));

            currentPDFBytes=
              await output.save();

            showResult(
              `Extracted ${requested.length} page(s).`
            );

            return;

          }


          if(tool.type==="pdf-rotator"){

            requested.forEach(pageNumber=>{

              const page=
                pdf.getPage(pageNumber-1);

              page.setRotation(
                PDFLib.degrees(
                  page.getRotation().angle+90
                )
              );

            });

            currentPDFBytes=
              await pdf.save();

            showResult(
              `Rotated ${requested.length} page(s).`
            );

            return;

          }

        }


        if(tool.type==="pdf-metadata"){

          const bytes=
            await pdfFiles[0].arrayBuffer();

          const pdf=
            await PDFLib.PDFDocument.load(bytes);

          showResult(
            `Pages: ${pdf.getPageCount()}\n`+
            `Title: ${pdf.getTitle()||"Not set"}\n`+
            `Author: ${pdf.getAuthor()||"Not set"}\n`+
            `Subject: ${pdf.getSubject()||"Not set"}\n`+
            `Creator: ${pdf.getCreator()||"Not set"}\n`+
            `Producer: ${pdf.getProducer()||"Not set"}`
          );

          return;

        }


        if(
          tool.type==="jpg-to-pdf"
        ){

          const output=
            await PDFLib.PDFDocument.create();

          for(const file of pdfFiles){

            const bytes=
              await file.arrayBuffer();

            let image;

            if(file.type==="image/jpeg"){
              image=await output.embedJpg(bytes);
            }else{
              image=await output.embedPng(bytes);
            }

            const page=
              output.addPage([
                image.width,
                image.height
              ]);

            page.drawImage(image,{
              x:0,
              y:0,
              width:image.width,
              height:image.height
            });

          }

          currentPDFBytes=
            await output.save();

          showResult(
            `Created PDF from ${pdfFiles.length} image(s).`
          );

          return;

        }


        showResult(
          "PDF loaded successfully. This operation is ready for the next processing step."
        );

      }catch(error){

        console.error(error);

        showError(
          "Could not process this PDF. Make sure it is a valid, readable PDF."
        );

      }

    };


  const download=
    document.getElementById("downloadResult");

  download.onclick=()=>{

    if(!currentPDFBytes){

      showError("Run the PDF operation first.");
      return;

    }

    downloadBlob(
      new Blob(
        [currentPDFBytes],
        {type:"application/pdf"}
      ),
      "getkit-result.pdf"
    );

  };

}


/* =========================================================
   PDF HELPERS
========================================================= */

let currentPDFBytes=null;

function parsePages(value,max){

  if(!value)return[];

  return [
    ...new Set(
      value
        .split(",")
        .map(v=>parseInt(v.trim(),10))
        .filter(n=>Number.isInteger(n)&&n>=1&&n<=max)
    )
  ];

}


/* =========================================================
   OUTPUT
========================================================= */

function showResult(text){

  const output=document.getElementById("output");

  if(!output)return;

  output.classList.remove("error");
  output.classList.add("success");

  output.textContent=text;

}


function showError(text){

  const output=document.getElementById("output");

  if(!output)return;

  output.classList.remove("success");
  output.classList.add("error");

  output.textContent=text;

}


/* =========================================================
   DOWNLOAD
========================================================= */

function downloadData(data,name){

  const a=document.createElement("a");

  a.href=data;
  a.download=name;

  document.body.appendChild(a);
  a.click();
  a.remove();

}


function downloadBlob(blob,name){

  const url=
    URL.createObjectURL(blob);

  downloadData(url,name);

  setTimeout(
    ()=>URL.revokeObjectURL(url),
    1000
  );

}


/* =========================================================
   HELPERS
========================================================= */

function formatBytes(bytes){

  if(!bytes)return"0 B";

  const units=["B","KB","MB","GB"];

  const i=
    Math.floor(
      Math.log(bytes)/Math.log(1024)
    );

  return(
    (bytes/Math.pow(1024,i)).toFixed(
      i?1:0
    )+
    " "+
    units[i]
  );

}


/* =========================================================
   INITIALIZE
========================================================= */

renderPopular();
renderTools();
